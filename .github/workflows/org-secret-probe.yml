name: Org Secret Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report which secret names resolve (values never printed)
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          B: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN non-empty: $A"
          echo "CLOUDFLARE_API_TOKEN empty: $B"
