name: Deploy GLM Chat Worker
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Create KV namespace (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        id: kv
        run: |
          set -e
          # RATE namespace likely exists already (idempotent deploys): LIST first, create only if absent.
          OUT2=$(npx wrangler kv namespace list 2>&1) || true
          echo "$OUT2"
          ID=$(echo "$OUT2" | grep -B6 'RATE' | grep -oE '[a-f0-9]{32}' | head -1) || true
          if [ -z "$ID" ]; then
            OUT=$(npx wrangler kv namespace create RATE 2>&1)
            echo "$OUT"
            ID=$(echo "$OUT" | grep -oE '[a-f0-9]{32}' | head -1)
          fi
          echo "KV_ID=$ID"
          if [ -z "$ID" ]; then echo "KV creation failed"; exit 1; fi
          echo "kv_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Write wrangler.toml
        run: |
          mkdir -p workers/glm-chat
          cat > workers/glm-chat/wrangler.toml <<TOML
          name = "glm-chat"
          main = "worker.js"
          compatibility_date = "2026-10-01"
          [[kv_namespaces]]
          binding = "RATE"
          id = "${{ steps.kv.outputs.kv_id }}"
          TOML

      - name: Write worker.js
        run: |
          cat > workers/glm-chat/worker.js <<'WORKER'
          const GLM_BASE = 'https://glm-api.zer0state.com/v1';
          const CORS = {
            'Access-Control-Allow-Origin': 'https://zer0state.com',
            'Access-Control-Allow-Methods': 'POST, OPTIONS',
            'Access-Control-Allow-Headers': 'Content-Type, X-Chat-Pass',
          };
          export default {
            async fetch(request, env) {
              if (request.method === 'OPTIONS') return new Response(null, { status: 204, headers: CORS });
              const url = new URL(request.url);
              if (url.pathname !== '/v1/chat/completions') return json({ error: 'not found' }, 404);
              const pass = request.headers.get('X-Chat-Pass') || '';
              if (!env.GATE_PASSPHRASE || !safeEqual(pass, env.GATE_PASSPHRASE)) {
                return json({ error: 'unauthorized' }, 401, CORS);
              }
              const ip = request.headers.get('CF-Connecting-IP') || 'unknown';
              const today = new Date().toISOString().slice(0, 10);
              const key = `rl:${ip}:${today}`;
              const count = parseInt((await env.RATE.get(key)) || '0', 10);
              if (count >= 30) return json({ error: 'daily limit reached (30). Come back tomorrow.' }, 429, CORS);
              await env.RATE.put(key, String(count + 1), { expirationTtl: 86400 });
              let input;
              try { input = await request.json(); } catch { return json({ error: 'bad json' }, 400, CORS); }
              // Build the upstream body from scratch: only validated messages and a bounded max_tokens
              // reach the GPU. Client-supplied extras (n, tools, model, ...) are dropped.
              const messages = cleanMessages(input && input.messages);
              if (!messages) return json({ error: 'messages must be 1-16 { role, content } items, content 1-16000 chars' }, 400, CORS);
              const body = {
                model: env.GLM_MODEL || 'GLM-5.3-Flash-EXL3',
                messages,
                max_tokens: boundedTokens(input.max_tokens),
                stream: false,
              };
              const upstream = await fetch(`${GLM_BASE}/chat/completions`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'CF-Access-Client-Id': env.GLM_CLIENT_ID,
                  'CF-Access-Client-Secret': env.GLM_CLIENT_SECRET,
                },
                body: JSON.stringify(body),
              });
              const text = await upstream.text();
              return new Response(text, { status: upstream.status, headers: { ...CORS, 'Content-Type': 'application/json' } });
            },
          };
          function json(obj, status, extra = {}) {
            return new Response(JSON.stringify(obj), { status, headers: { 'Content-Type': 'application/json', ...CORS, ...extra } });
          }
          function safeEqual(a, b) {
            if (a.length !== b.length) return false;
            let r = 0;
            for (let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i);
            return r === 0;
          }
          const ROLES = new Set(['system', 'user', 'assistant']);
          function cleanMessages(list) {
            if (!Array.isArray(list) || list.length < 1 || list.length > 16) return null;
            const out = [];
            for (const m of list) {
              if (!m || !ROLES.has(m.role) || typeof m.content !== 'string') return null;
              if (m.content.length < 1 || m.content.length > 16000) return null;
              out.push({ role: m.role, content: m.content });
            }
            return out;
          }
          // Integer 1..4096, default 2048. Strings, NaN, negatives and floats never reach upstream.
          function boundedTokens(v) {
            return Number.isInteger(v) && v >= 1 ? Math.min(v, 4096) : 2048;
          }
          WORKER

      - name: Deploy worker
        working-directory: workers/glm-chat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Secrets arrive as env vars, never interpolated into the script text, so quotes or $ in a
          # value cannot break or inject into the shell.
          GLM_CLIENT_ID: ${{ secrets.GLM_CLIENT_ID }}
          GLM_CLIENT_SECRET: ${{ secrets.GLM_CLIENT_SECRET }}
          GATE_PASSPHRASE: ${{ secrets.GATE_PASSPHRASE }}
        run: |
          set -e
          npx wrangler deploy 2>&1 | tee deploy.log
          # set worker secrets via wrangler (values from repo secrets)
          printf '%s' "$GLM_CLIENT_ID" | npx wrangler secret put GLM_CLIENT_ID
          printf '%s' "$GLM_CLIENT_SECRET" | npx wrangler secret put GLM_CLIENT_SECRET
          printf '%s' "$GATE_PASSPHRASE" | npx wrangler secret put GATE_PASSPHRASE
          echo -n "GLM-5.3-Flash-EXL3" | npx wrangler secret put GLM_MODEL

      - name: Smoke test
        run: |
          sleep 5
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://glm-chat.zer0state-noema.workers.dev/v1/chat/completions -H 'Content-Type: application/json' -d '{}')
          echo "unauth probe -> $CODE (expect 401)"
          test "$CODE" = "401"
