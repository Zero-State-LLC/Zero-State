<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc" class="balanced-aperture">
  <title id="title">Zero State Balanced Aperture Mark — Cinematic States</title>
  <desc id="desc">Open reference frame surrounding a split zero ring. The yellow dashed highway passes through the exact center and split axis — the world moves, the reference remains. Supports static, passage, and residue states.</desc>

  <!-- Reference Frame (Aperture Corners) - Diegetic + Cinematic -->
  <g id="aperture-frame" fill="none" stroke="#1D2321" stroke-linecap="square" stroke-linejoin="miter">
    <g stroke-width="54">
      <!-- Top-left L -->
      <path d="M 118 118 H 338"/>
      <path d="M 118 118 V 338"/>
      <!-- Top-right L -->
      <path d="M 882 118 H 662"/>
      <path d="M 882 118 V 338"/>
      <!-- Bottom-left L -->
      <path d="M 118 882 H 338"/>
      <path d="M 118 882 V 662"/>
      <!-- Bottom-right L -->
      <path d="M 882 882 H 662"/>
      <path d="M 882 882 V 662"/>
    </g>
  </g>

  <!-- Split Zero Ring Arcs -->
  <g id="zero-ring" fill="none" stroke="#1D2321" stroke-linecap="round">
    <!-- One arc of the split ring -->
    <path id="zero-arc-1" d="M 291.72 668.66 A 268 268 0 0 1 668.66 291.72" stroke-width="70"/>
    <!-- Complementary arc -->
    <path id="zero-arc-2" d="M 708.28 331.34 A 268 268 0 0 1 331.34 708.28" stroke-width="70"/>
  </g>

  <!-- Highway Centerline - The sole signal of directed change / passage -->
  <!-- Default static or pre-pass position; JS/CSS triggers the pass -->
  <g id="highway-group">
    <path id="highway-line" 
          class="highway-line"
          d="M -260 1260 L 1260 -260" 
          fill="none" 
          stroke="#F2C200" 
          stroke-width="58" 
          stroke-linecap="butt" 
          stroke-dasharray="150 150"
          data-axis-start="-260,1260" 
          data-axis-center="500,500" 
          data-axis-end="1260,-260"/>
  </g>

  <!-- Residue / Trace layer (faint after passage or persistent memory) -->
  <g id="residue-layer" opacity="0.15" stroke="#1D2321" fill="none">
    <path d="M -260 1260 L 1260 -260" stroke-width="20" stroke-dasharray="80 200"/>
    <!-- Subtle frame echo -->
    <path d="M 118 118 H 338" stroke-width="8"/>
    <path d="M 118 118 V 338" stroke-width="8"/>
  </g>
</svg>
