<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Zero State Balanced Aperture Mark — Profound States</title>
  <desc id="desc">Open reference frame surrounding a split zero ring. The yellow dashed highway passes the exact center and split axis. Recurrence mutates form. The passage carries mutable reflection. Residue holds the mediated echo with open interpretation. The world moves. The reference remains.</desc>

  <!-- Primary Aperture Frame (Enclosure / Reference) -->
  <g id="aperture-frame-primary" fill="none" stroke="#1D2321" stroke-linecap="square" stroke-linejoin="miter">
    <g stroke-width="54">
      <path d="M 118 118 H 338"/><path d="M 118 118 V 338"/>
      <path d="M 882 118 H 662"/><path d="M 882 118 V 338"/>
      <path d="M 118 882 H 338"/><path d="M 118 882 V 662"/>
      <path d="M 882 882 H 662"/><path d="M 882 882 V 662"/>
    </g>
  </g>

  <!-- Split Zero Ring Arcs (Null / Potential / State Change) -->
  <g id="zero-ring" fill="none" stroke="#1D2321" stroke-linecap="round">
    <path class="zero-ring-arc" d="M 291.72 668.66 A 268 268 0 0 1 668.66 291.72" stroke-width="70"/>
    <path class="zero-ring-arc" d="M 708.28 331.34 A 268 268 0 0 1 331.34 708.28" stroke-width="70"/>
  </g>

  <!-- Primary Highway (Directed Change / Threshold Crossing) -->
  <path id="highway-primary" class="highway-line" 
        d="M -260 1260 L 1260 -260" 
        fill="none" stroke="#F2C200" stroke-width="58" stroke-linecap="butt" stroke-dasharray="150 150"
        data-axis-center="500,500"/>

  <!-- Mercurial Echo (quicksilver mediation / mutable reflective trace of the passage) -->
  <g id="mercurial-echo" class="mercurial-echo" opacity="0.07">
    <!-- Primary mutable echo - offset for fluidity and mediation -->
    <path d="M -240 1240 L 1240 -240" fill="none" stroke="#F2C200" stroke-width="16" stroke-linecap="butt" stroke-dasharray="110 160"/>
    <!-- Reflective inversion layer (mirrors across the split axis for reconciliation of opposites) -->
    <path d="M -220 1220 L 1220 -220" fill="none" stroke="#E8E8E8" stroke-width="8" stroke-linecap="butt" stroke-dasharray="80 190" opacity="0.6"/>
  </g>


  <!-- Residue Layer 1 — Initial Trace (after first passage) -->
  <g id="residue-1" opacity="0.14">
    <path d="M -260 1260 L 1260 -260" stroke="#1D2321" stroke-width="22" stroke-dasharray="70 210"/>
  </g>

  <!-- Residue Layer 2 — Accumulated / Mutated (deeper persistence, slight inversion) -->
  <g id="residue-2" opacity="0.09">
    <path d="M -180 1180 L 1180 -180" stroke="#1D2321" stroke-width="14" stroke-dasharray="110 170"/>
    <!-- Subtle frame mutation / enclosure shift -->
    <path d="M 130 130 H 320" stroke-width="9" opacity="0.6"/>
    <path d="M 870 130 H 680" stroke-width="9" opacity="0.6"/>
  </g>

  <!-- Threshold Markers (subtle geometric accents for CROSS_THRESHOLD / ENCLOSE) -->
  <g id="threshold-markers" fill="none" stroke="#1D2321" stroke-width="12" opacity="0.08">
    <circle cx="500" cy="500" r="268"/>
  </g>
</svg>
