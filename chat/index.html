<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLM — zer0state access</title>
<meta name="robots" content="noindex">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: #0a0f1c; color: #dce4f5;
  font: 15px/1.55 -apple-system, 'Segoe UI', sans-serif;
  display: flex; flex-direction: column;
}
header {
  padding: 1rem 1.2rem; border-bottom: 1px solid #232c44;
  display: flex; align-items: baseline; gap: .6rem;
}
header h1 { font-size: .95rem; margin: 0; letter-spacing: .12em; }
header span { color: #6b7794; font-size: .75rem; }
#log {
  flex: 1; overflow-y: auto; padding: 1.2rem; max-width: 860px; margin: 0 auto; width: 100%;
  display: flex; flex-direction: column; gap: .8rem;
}
.msg { padding: .7rem 1rem; border-radius: 12px; max-width: 82%; white-space: pre-wrap; word-wrap: break-word; }
.msg.user { align-self: flex-end; background: #2b3554; }
.msg.assistant { align-self: flex-start; background: #171f36; border: 1px solid #232c44; }
.msg.assistant.thinking { color: #6b7794; font-style: italic; }
.msg.error { align-self: center; background: #3a1620; color: #f0a7b8; font-size: .85rem; }
form {
  display: flex; gap: .6rem; padding: 1rem 1.2rem; border-top: 1px solid #232c44;
  max-width: 860px; margin: 0 auto; width: 100%;
}
textarea {
  flex: 1; resize: none; background: #131a2e; border: 1px solid #232c44; color: #dce4f5;
  border-radius: 10px; padding: .7rem .9rem; font: inherit; min-height: 48px; max-height: 160px;
}
textarea:focus { outline: 1px solid #4a5b8c; }
button {
  background: #7c66dc; color: white; border: 0; border-radius: 10px; padding: 0 .9rem;
  font: inherit; cursor: pointer;
}
button:disabled { opacity: .45; cursor: default; }
#gate {
  position: fixed; inset: 0; background: #0a0f1c; display: grid; place-content: center;
  gap: .8rem; text-align: center; z-index: 10;
}
#gate p { color: #6b7794; margin: 0 0 .4rem; font-size: .85rem; }
#gate input {
  background: #131a2e; border: 1px solid #232c44; color: #dce4f5; border-radius: 10px;
  padding: .7rem 1rem; font: inherit; text-align: center; width: 260px;
}
@media (max-width: 640px) { .msg { max-width: 92%; } }
</style>
</head>
<body>
<div id="gate">
  <p>Access passphrase — ask Aaron.</p>
  <input id="pass" type="password" placeholder="passphrase" autocomplete="off">
  <button id="gate-go">Enter</button>
</div>
<header>
  <h1>GLM · zer0state</h1><span>GLM-5.3-Flash · 2×DGX Spark cluster · private preview</span>
</header>
<div id="log"></div>
<form id="f">
  <textarea id="t" rows="1" placeholder="Say something…"></textarea>
  <button id="send">Send</button>
</form>
<script>
const WORKER = 'https://glm-chat.zer0state.workers.dev/v1/chat/completions';
const $ = (s) => document.querySelector(s);
const log = $('#log'), t = $('#t'), send = $('#send');
let pass = sessionStorage.getItem('chat-pass') || '';
let history = [];

if (pass) $('#gate').style.display = 'none';
$('#gate-go').onclick = () => {
  pass = $('#pass').value;
  if (!pass) return;
  sessionStorage.setItem('chat-pass', pass);
  $('#gate').style.display = 'none';
  t.focus();
};
$('#pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#gate-go').click(); });

function add(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  log.append(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

async function sendMsg() {
  const text = t.value.trim();
  if (!text || send.disabled) return;
  t.value = '';
  add('user', text);
  history.push({ role: 'user', content: text });
  const thinking = add('assistant', '…');
  send.disabled = true;
  try {
    const res = await fetch(WORKER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Chat-Pass': pass },
      body: JSON.stringify({ messages: history.slice(-16), max_tokens: 2048 }),
    });
    const data = await res.json();
    const reply = data?.choices?.[0]?.message?.content;
    if (!res.ok || !reply) throw new Error(data?.error || res.status);
    history.push({ role: 'assistant', content: reply });
    thinking.textContent = reply;
  } catch (err) {
    thinking.className = 'msg error';
    thinking.textContent = typeof err.message === 'string' && err.message !== '[object Object]'
      ? 'Error: ' + err.message
      : 'Error: could not reach the model.';
  }
  send.disabled = false;
  t.focus();
}

$('#f').addEventListener('submit', (e) => { e.preventDefault(); sendMsg(); });
t.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
</script>
</body>
</html>
